---
default_install_hook_types: [commit-msg, pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.24.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        args: [--strict]
        entry: yamllint
        language: system
        types: [yaml]
      - id: mdformat
        name: mdformat
        entry: mdformat
        language: system
        types: [markdown]
      - id: pymarkdown
        name: pymarkdown
        args: [scan]
        entry: pymarkdown
        language: system
        types: [markdown]
      - id: shellcheck
        name: shellcheck
        args: [-x]
        entry: shellcheck
        language: system
        types_or: [shell, file]
        files: (\.sh$|\.bash_aliases$)
      - id: stylua
        name: stylua
        args: [-a]
        entry: stylua
        language: system
        types: [lua]
      - id: yamlfmt
        name: yamlfmt
        entry: yamlfmt
        language: system
        types: [yaml]
